[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "junhyunbank"
version = "2.0.0"
description = "Live-only adaptive Upbit microstructure trading desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
  "keyring>=25,<26",
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13.7,<1",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
junhyunbank = "junhyunbank.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
