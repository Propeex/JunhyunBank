name: test

on:
  push:
    branches: ["main", "v1-development"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Unit and regression tests
        run: pytest -q
      - name: Read-only Upbit public WebSocket smoke test
        run: python scripts/smoke_upbit_public_ws.py --timeout 20 --attempts 3
