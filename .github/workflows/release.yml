name: release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller
      - name: Unit and regression tests
        run: pytest -q
      - name: Read-only Upbit market discovery and public WebSocket smoke test
        run: python scripts/smoke_upbit_public_ws.py --timeout 20 --attempts 3
      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name JunhyunBank launcher.py
      - name: Resolve release tag
        shell: pwsh
        run: |
          $version = python -c "from junhyunbank import __version__; print(__version__)"
          "TAG=V$($version.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$env:TAG release already exists; skipping."
            exit 0
          }
          gh release create $env:TAG .\dist\JunhyunBank.exe --target "${{ github.sha }}" --title "$env:TAG" --generate-notes
